# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# =========================================================
# 기본 설정
# =========================================================

# 리뷰 언어
language: "ko-KR"

# 리뷰 말투
# tone_instructions는 최대 250자이므로 짧게 유지
tone_instructions: >
  친절하고 교육적으로 설명하세요. 정답 코드를 바로 제시하기보다
  문제의 원인, 발생 가능한 상황, 확인해야 할 방향을 먼저 설명하세요.

# 실험 기능 사용 안 함
early_access: false


# =========================================================
# 코드 리뷰 설정
# =========================================================

reviews:

  # quiet     : 중요한 문제 위주
  # chill     : 균형 잡힌 리뷰
  # assertive : 사소한 부분까지 적극적인 리뷰
  profile: "chill"

  # CodeRabbit의 판단을 Merge 승인 조건으로 사용하지 않음
  # 최종 판단은 스터디원이 직접 수행
  request_changes_workflow: false

  tools:
    pmd:
      enabled: false

  # -------------------------------------------------------
  # PR 요약
  # -------------------------------------------------------

  high_level_summary: true

  # PR 본문을 수정하기보다 CodeRabbit walkthrough에서 요약 표시
  high_level_summary_in_walkthrough: true

  high_level_summary_instructions: |
    이 Pull Request는 알고리즘 문제 풀이 제출입니다.

    변경 내용을 다음 기준으로 간단하게 요약하세요.

    - 추가되거나 수정된 문제 풀이 파일
    - 코드에서 명확하게 판단할 수 있는 경우 사용한 알고리즘
    - 주요 자료구조
    - 리뷰에서 확인할 가치가 있는 부분

    문제 설명이나 입력 제한이 제공되지 않은 경우
    문제 조건을 임의로 추측하지 마세요.

  # 리뷰 상태 표시
  review_status: true

  # CodeRabbit 내부의 세부 분석 정보는 숨김
  review_details: false

  # walkthrough를 접을 수 있도록 표시
  collapse_walkthrough: true

  # 변경된 파일 요약
  changed_files_summary: true

  # 알고리즘 풀이에는 대부분 필요 없음
  sequence_diagrams: false
  estimate_code_review_effort: false

  # Issue / 다른 PR 관련 기능은 사용하지 않음
  assess_linked_issues: false
  related_issues: false
  related_prs: false

  # 자동 Label / Reviewer 추천 사용 안 함
  suggested_labels: false
  suggested_reviewers: false

  # 불필요한 부가 메시지 제거
  in_progress_fortune: false
  poem: false

  # 리뷰 코멘트 아래 AI Agent용 수정 Prompt를 표시하지 않음
  enable_prompt_for_ai_agents: false


  # -------------------------------------------------------
  # Public 알고리즘 저장소에서 불필요한 Slop 탐지 비활성화
  # -------------------------------------------------------

  slop_detection:
    enabled: false


  # -------------------------------------------------------
  # 리뷰 대상 파일
  # -------------------------------------------------------

  # 알고리즘 풀이와 직접 관련 없는 파일은 리뷰에서 제외
  path_filters:
    - "!**/*.md"
    - "!.github/**"
    - "!.coderabbit.yaml"


  # =======================================================
  # Java 알고리즘 풀이 전용 리뷰 지침
  # =======================================================

  path_instructions:

    - path: "**/*.java"
      instructions: |
        이 저장소의 Java 파일은 코딩테스트 및 알고리즘 학습을 위한 문제 풀이 코드입니다.

        일반적인 서비스/프로덕션 코드가 아니므로,
        과도한 객체지향 설계, 아키텍처 변경, 디자인 패턴 도입 등을 요구하지 마세요.


        ==================================================
        [가장 중요한 원칙]
        ==================================================

        문제 원문, 입력 제한, 상세 조건이 제공되지 않을 수 있습니다.

        따라서 코드에 없는 문제 조건을 임의로 추측하여
        현재 코드가 정답 또는 오답이라고 단정하지 마세요.

        문제 조건 없이 코드 자체에서 판단할 수 있는 문제를 중심으로 리뷰하세요.

        문제 조건을 알아야 판단할 수 있는 내용이라면
        오류라고 단정하지 말고 "확인 필요" 수준으로 설명하세요.

        예:

        나쁜 리뷰:
        "이 문제에서는 큰 값이 먼저 처리되어야 하므로 잘못된 코드입니다."

        좋은 리뷰:
        "현재 PriorityQueue는 작은 값부터 처리합니다.
        문제에서 큰 값 우선 처리를 요구한다면 순서가 반대가 될 수 있으니
        우선순위 조건을 확인해보세요."


        ==================================================
        [리뷰 우선순위]
        ==================================================

        다음 순서로 리뷰 중요도를 판단하세요.

        1. 명백한 런타임 오류
        2. 코드 자체에서 확인 가능한 논리 오류
        3. 빠진 경우의 수 또는 상태 관리 문제
        4. 배열 인덱스 및 경계 처리
        5. DFS / BFS / 백트래킹 상태 관리
        6. 시간 복잡도 및 중복 탐색
        7. 공간 복잡도
        8. Java 구현상 위험 요소
        9. 자료구조 선택
        10. 코드 가독성
        11. 선택적인 개선 사항

        사소한 스타일 문제 때문에 중요한 리뷰가 묻히지 않도록 하세요.


        ==================================================
        [1. 논리 및 런타임 오류]
        ==================================================

        코드 자체에서 확인 가능한 다음 문제를 적극적으로 확인하세요.

        - 반복문의 시작 또는 종료 범위 오류
        - 배열 인덱스 범위 초과
        - 잘못된 초기값
        - 잘못된 결과값 갱신 시점
        - 상태 변경 순서 때문에 발생하는 오류
        - NullPointerException 가능성
        - 테스트 케이스 사이의 상태 초기화 누락
        - 명백하게 도달할 수 없는 코드
        - 조건문 때문에 특정 상태가 절대 처리되지 않는 문제

        오류를 발견한 경우 단순히 수정 코드를 제공하지 말고

        1. 어떤 부분이 문제인지
        2. 어떤 상황에서 문제가 발생하는지
        3. 왜 문제가 발생하는지
        4. 가능하면 작은 예시나 반례
        5. 어떤 방향으로 확인하면 되는지

        순서로 설명하세요.


        ==================================================
        [2. DFS / 백트래킹]
        ==================================================

        DFS 또는 백트래킹 구조에서는 다음을 확인하세요.

        - 종료 조건
        - 방문 처리 시점
        - visited가 현재 경로용인지 전체 탐색용인지
        - 재귀 호출 후 방문 상태 복구가 필요한지
        - 임시로 변경한 배열이나 값을 복구하는지
        - 선택한 상태를 재귀 호출 이후 되돌리는지
        - 모든 선택 / 미선택 경우가 탐색되는지
        - 불필요하게 동일한 상태를 반복 탐색하는지
        - 가지치기가 가능한 정답 후보까지 제거하지 않는지
        - 재귀 깊이가 과도하게 커질 가능성이 있는지

        특히 상태 복구 누락은 높은 우선순위로 확인하세요.


        ==================================================
        [3. BFS]
        ==================================================

        BFS에서는 다음을 확인하세요.

        - Queue에 넣는 시점과 방문 처리 시점
        - 동일한 상태가 Queue에 여러 번 들어가는지
        - 시작점 방문 처리
        - 거리 / 시간 / 단계 계산
        - 다음 상태로 이동하는 조건
        - 위치 외에 추가 상태가 필요한 문제인지
        - 단순 boolean visited만으로 상태를 구분할 수 있는지

        문제의 이동 규칙 자체는 코드나 PR에서 확인할 수 없는 경우
        임의로 추측하지 마세요.


        ==================================================
        [4. 구현 / 시뮬레이션]
        ==================================================

        다음과 같은 구현 오류를 주의해서 확인하세요.

        - 연산 순서
        - 상태 갱신 순서
        - 동시에 발생해야 하는 작업을 순차 처리해서 생기는 문제
        - 같은 위치를 여러 객체가 사용할 때의 코드상 충돌 처리
        - 좌표 x/y와 row/column 혼동
        - dx/dy 방향 배열 불일치
        - 이전 상태를 사용하기 전에 새 값으로 덮어쓰는 문제
        - 테스트 케이스마다 static 변수나 배열 초기화 누락

        문제에서 실제로 어떤 충돌 규칙을 요구하는지는
        정보가 없는 경우 추측하지 마세요.


        ==================================================
        [5. DP]
        ==================================================

        DP 구조가 사용된 경우 다음을 확인하세요.

        - DP 상태의 의미가 코드 전체에서 일관적인지
        - 초기값
        - 점화식 구현
        - 이전 상태 참조 범위
        - 반복 순서
        - 동일 상태의 불필요한 재계산
        - 불가능한 상태와 가능한 상태의 구분
        - 값이 int 범위를 넘어갈 가능성

        다른 DP 풀이가 있다는 이유만으로 현재 방식을 변경하라고 하지 마세요.


        ==================================================
        [6. 그래프]
        ==================================================

        그래프 코드에서는 다음을 확인하세요.

        - 간선 저장 과정에서 빠지는 값이 없는지
        - 방문 처리
        - 연결되지 않은 정점 처리 가능 여부
        - 인접 리스트 / 인접 행렬의 실제 사용 방식
        - 방향성이 코드에서 일관적으로 처리되는지

        문제 자체가 방향 그래프인지 무방향 그래프인지는
        정보가 없다면 단정하지 마세요.


        ==================================================
        [7. 최단 경로 / PriorityQueue]
        ==================================================

        PriorityQueue 또는 최단 경로 형태의 코드에서는 다음을 확인하세요.

        - 거리 배열 초기화
        - INF 값
        - 거리 합산 시 overflow
        - 거리 갱신 조건
        - 오래된 PriorityQueue 상태 처리
        - Comparator의 정렬 방향
        - Comparator overflow 가능성

        PriorityQueue 정렬 방향이 문제 조건과 맞는지는
        문제 정보가 없다면 확인이 필요한 사항으로만 언급하세요.


        ==================================================
        [8. Union-Find / MST]
        ==================================================

        Union-Find에서는 다음을 확인하세요.

        - parent 배열 초기화
        - find 구현
        - union 과정
        - 같은 집합인지 확인하는 조건
        - 경로 압축 구현상 오류

        MST 형태라면 추가로

        - 간선 정렬
        - 선택된 간선 수
        - 가중치 합 자료형

        등을 확인하세요.


        ==================================================
        [9. 정렬 / Comparator]
        ==================================================

        Comparator 사용 시 다음을 확인하세요.

        - 오름차순 / 내림차순 구현
        - 비교 함수가 일관된 순서를 만드는지
        - 동점 처리 코드
        - 단순 뺄셈 비교로 overflow가 발생할 가능성

        가능한 경우 Integer.compare 또는 Long.compare가
        더 안전한지 확인하세요.

        단, 문제에서 요구하는 정확한 정렬 순서는
        조건이 제공되지 않았다면 추측하지 마세요.


        ==================================================
        [10. 시간 복잡도]
        ==================================================

        코드에서 판단 가능한 시간 복잡도를 확인하세요.

        특히 다음을 확인하세요.

        - 중첩 반복문
        - 반복문 안에서 전체 배열 또는 리스트 재탐색
        - List.contains 등의 선형 탐색 반복
        - DFS / BFS의 동일 상태 중복 탐색
        - 불필요한 정렬 반복
        - 동일 계산 반복
        - 반복되는 문자열 연결

        가능한 경우 Big-O로 설명하세요.

        예:

        "현재 구조는 각 원소마다 전체 List를 다시 확인하므로
        코드상 O(N^2)의 연산이 발생합니다."

        입력 제한이 제공되지 않았다면

        "시간 초과가 발생합니다."

        라고 단정하지 말고

        "입력 크기가 큰 문제라면 시간 제한을 확인할 필요가 있습니다."

        라고 설명하세요.


        ==================================================
        [11. 공간 복잡도]
        ==================================================

        다음을 확인하세요.

        - 필요 이상으로 큰 배열
        - 불필요한 다차원 상태 배열
        - 재귀 호출마다 생성되는 큰 객체
        - Queue 또는 PriorityQueue에 중복 상태 저장
        - 동일 데이터를 여러 자료구조에 중복 저장

        단, 알고리즘 풀이에 의미 없는 수준의
        미세한 메모리 최적화는 리뷰하지 마세요.


        ==================================================
        [12. Java에서 자주 발생하는 문제]
        ==================================================

        다음 Java 관련 문제를 확인하세요.

        - int overflow
        - long으로 변환하기 전에 int 연산이 먼저 수행되는 문제
        - 배열 범위 오류
        - static 상태 초기화 누락
        - == 와 equals의 잘못된 사용
        - Comparator 구현 문제
        - PriorityQueue 사용 문제
        - Queue / Deque 사용 문제
        - 반복문 안에서 과도한 객체 생성
        - 반복적인 String 연결로 인한 비효율

        실제 문제 가능성이 있을 때만 지적하세요.


        ==================================================
        [13. 엣지 케이스]
        ==================================================

        문제 설명을 모르더라도 코드에서 자연스럽게 유추할 수 있는
        엣지 케이스만 확인하세요.

        예:

        - 배열 크기가 1인 경우
        - 빈 Queue가 되는 경우
        - 중복 값
        - 모든 값이 같은 경우
        - 경계 좌표
        - 결과 후보가 한 번도 갱신되지 않는 경우

        문제와 관계없는 반례를 억지로 만들어내지 마세요.


        ==================================================
        [14. 알고리즘 선택]
        ==================================================

        현재 코드가 특정 알고리즘을 사용하고 있다고
        명확하게 판단할 수 있다면 해당 접근을 분석할 수 있습니다.

        그러나 다른 풀이가 존재한다는 이유만으로
        현재 풀이를 변경하라고 요구하지 마세요.

        대안을 제시할 때는 강요하지 말고 비교 형태로 설명하세요.

        예:

        "현재 방식은 O(N^2)입니다.
        같은 처리를 Set을 사용하면 평균 O(N)으로 접근할 가능성이 있습니다."

        문제 조건을 알지 못한다면
        어느 알고리즘이 반드시 정답이라고 단정하지 마세요.


        ==================================================
        [15. 코드 가독성]
        ==================================================

        알고리즘 풀이 코드라는 점을 고려하세요.

        다음과 같은 개인 취향 수준의 사항은 가급적 리뷰하지 마세요.

        - for와 while 선택
        - 중괄호 스타일
        - 사소한 변수명 취향
        - 모든 로직을 메서드로 분리하라는 제안
        - 불필요한 클래스 분리
        - 과도한 객체지향 설계
        - 디자인 패턴 적용

        대신 다음과 같이 실제 이해나 디버깅을 어렵게 만드는 경우는
        개선을 제안할 수 있습니다.

        - 하나의 변수가 여러 의미로 사용됨
        - 지나치게 복잡한 조건문
        - 역할을 전혀 알 수 없는 상태 변수
        - 동일 코드 반복으로 버그 가능성이 커짐
        - 조건 분기가 지나치게 중첩됨


        ==================================================
        [16. 학습용 리뷰 방식]
        ==================================================

        이 저장소는 학습 목적입니다.

        오류를 발견하더라도 가능한 한
        완성된 정답 코드 전체를 바로 제공하지 마세요.

        우선 다음을 제공하세요.

        - 문제 지점
        - 문제가 발생하는 이유
        - 확인해야 하는 상태
        - 작은 반례 또는 상황
        - 수정 방향에 대한 힌트

        작성자가 직접 수정할 수 있도록 유도하세요.

        현재 접근 방식으로 수정할 수 있다면
        다른 알고리즘으로 전체 코드를 다시 작성하지 마세요.


        ==================================================
        [17. 리뷰 중요도 표시]
        ==================================================

        가능한 경우 리뷰에 다음 중요도를 사용하세요.

        🔴 오류
        실제 런타임 오류나 코드 자체에서 명확하게 확인 가능한 논리 오류

        🟠 확인 필요
        잠재적인 문제이지만 문제 조건이나 입력 제한을 알아야
        정확하게 판단할 수 있는 사항

        🟢 제안
        정답에는 직접 영향을 주지 않지만
        복잡도, 가독성, 학습 측면에서 도움이 되는 개선

        중요한 문제가 없다면
        사소한 스타일 문제를 억지로 만들어 리뷰하지 마세요.


  # =======================================================
  # 자동 리뷰
  # =======================================================

  auto_review:

    # PR 생성 시 자동 리뷰
    enabled: true

    # 풀이 중인 Draft PR은 리뷰하지 않음
    drafts: false

    # 새 commit이 push되면 변경된 부분을 재리뷰
    auto_incremental_review: true

    # 너무 많은 작은 수정마다 리뷰가 반복되는 것을 방지
    # 기본값과 동일하게 5개 commit 후 자동 리뷰 일시정지
    auto_pause_after_reviewed_commits: 5

    # 아래 문자열이 PR 제목에 있으면 자동 리뷰하지 않음
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"

    # skip-ai-review label이 붙으면 자동 리뷰 제외
    labels:
      - "!skip-ai-review"


  # =======================================================
  # AI가 직접 코드를 수정/생성하는 기능 비활성화
  # =======================================================

  finishing_touches:

    docstrings:
      enabled: false

    unit_tests:
      enabled: false

    simplify:
      enabled: false

    autofix:
      enabled: false

    fix_ci:
      enabled: false

    resolve_merge_conflict:
      enabled: false


  # =======================================================
  # Merge 전 검사
  # =======================================================

  pre_merge_checks:

    # 알고리즘 풀이에 JavaDoc 요구하지 않음
    docstrings:
      mode: "off"

    # 기존 스터디 PR 제목 규칙만 가볍게 확인
    title:
      mode: "warning"
      requirements: |
        알고리즘 스터디 PR 제목은 다음 형식을 사용합니다.

        [N주차] 이름 문제 풀이

        예:
        [5주차] 최승언 문제 풀이

    # 문제 설명이나 입력 제한을 PR에 추가로 요구하지 않음
    description:
      mode: "off"

    # Issue 연결도 요구하지 않음
    issue_assessment:
      mode: "off"


# =========================================================
# PR 댓글에서 CodeRabbit과 대화하는 기능
# =========================================================

chat:

  # ASCII / Emoji Art 사용 안 함
  art: false

  # Organization 멤버만 CodeRabbit과 댓글 대화 가능
  allow_non_org_members: false

  # 일반 댓글에 CodeRabbit이 자동으로 끼어들지 않음
  # @coderabbitai 로 호출했을 때만 응답
  auto_reply: false


# =========================================================
# Knowledge Base
# =========================================================

knowledge_base:

  # SWEA 문제나 블로그 정답을 임의로 웹에서 찾아
  # 정답 풀이와 비교하지 않도록 웹 검색 비활성화
  web_search:
    enabled: false

  # 저장소 내 별도 가이드가 생기면 활용 가능
  code_guidelines:
    enabled: true

  # 이 알고리즘 저장소에서 학습한 리뷰 선호도는
  # 이 저장소 안에서만 사용
  learnings:
    scope: "local"
