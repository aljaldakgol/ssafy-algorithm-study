# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# =========================================================
# 기본 설정
# =========================================================

# 모든 리뷰의 기본 언어를 한국어로 설정
language: "ko-KR"

# 리뷰 말투
tone_instructions: >
  모든 리뷰는 한국어로 작성하세요. 친절하고 교육적으로 설명하되,
  정답 코드를 대신 작성하기보다 개선 이유와 방향을 명확하게 설명하세요.

early_access: false


# =========================================================
# 리뷰 설정
# =========================================================

reviews:

  # 적극적으로 개선점을 찾아 리뷰
  # 정답 오류뿐 아니라 가독성, 복잡도, 구조, best practice까지 검토
  profile: "assertive"

  # CodeRabbit의 리뷰를 Merge 승인 조건으로 사용하지 않음
  request_changes_workflow: false


  # =======================================================
  # PR 전체 풀이 분석
  # =======================================================

  high_level_summary: true
  high_level_summary_in_walkthrough: true

  # 풀이 분석을 바로 볼 수 있도록 펼쳐서 표시
  collapse_walkthrough: false

  changed_files_summary: true
  review_status: true
  review_details: false

  # 불필요한 부가 메시지 제거
  in_progress_fortune: false
  poem: false

  # AI Agent에게 바로 코드를 수정시키는 Prompt를 표시하지 않음
  enable_prompt_for_ai_agents: false


  # -------------------------------------------------------
  # PR 전체 요약 방식
  # -------------------------------------------------------

  high_level_summary_instructions: |
    이 Pull Request는 알고리즘 문제 풀이 제출입니다.

    모든 내용은 반드시 한국어로 작성하세요.

    이 저장소에서는 단순히 오류를 찾는 것보다
    작성자의 풀이를 분석하고 더 좋은 코드로 개선할 수 있도록
    피드백하는 것이 중요합니다.

    변경된 각 Java 풀이 파일을 개별적으로 분석하세요.

    각 파일마다 다음 형식을 사용하세요.

    ## 풀이 분석

    ### 접근 방식
    - 현재 코드가 어떤 방식으로 문제를 해결하고 있는지 설명
    - 코드에서 판단 가능한 알고리즘 또는 탐색 방법
    - 사용한 주요 자료구조

    ### 복잡도
    - 코드에서 판단 가능한 시간 복잡도
    - 코드에서 판단 가능한 공간 복잡도
    - 불필요한 반복이나 중복 계산이 있는지

    ### 잘한 부분
    - 구현상 좋은 선택
    - 적절한 자료구조 사용
    - 명확한 상태 관리
    - 좋은 가지치기
    - 이해하기 쉬운 코드 구조 등
    구체적인 근거를 들어 1~3개 설명

    ### 개선할 부분
    정답 여부와 관계없이 다음을 검토하세요.

    - 시간 복잡도를 줄일 수 있는 부분
    - 공간 복잡도를 줄일 수 있는 부분
    - 중복 탐색 또는 중복 계산
    - 불필요한 반복
    - 더 적절한 자료구조
    - 복잡하거나 중첩된 조건문
    - 중복 코드
    - 불필요하게 복잡한 상태 관리
    - 가독성을 떨어뜨리는 코드 구조
    - 적절한 메서드 분리
    - Java에서 더 안전하거나 명확하게 작성할 수 있는 부분

    개선할 부분이 실제로 없다면
    억지로 만들어내지 말고 "의미 있는 개선 사항 없음"이라고 작성하세요.

    ### 다른 접근
    현재 풀이와 비교할 가치가 있는 다른 접근이 있다면 설명하세요.

    다음 중 하나 이상의 장점이 있을 때만 제안하세요.

    - 시간 복잡도 개선
    - 공간 복잡도 개선
    - 구현 단순화
    - 가독성 개선
    - 학습 가치가 큰 대표적인 다른 알고리즘

    단순히 다른 풀이가 존재한다는 이유만으로 제안하지 마세요.

    ### 총평
    다음 중 어떤 상황인지 간단하게 정리하세요.

    - 현재 방식 그대로 유지해도 좋은 풀이
    - 알고리즘은 적절하지만 구현 개선이 가능한 풀이
    - 다른 자료구조를 고려할 가치가 있는 풀이
    - 다른 알고리즘과 비교해볼 가치가 있는 풀이

    문제 원문이나 입력 제한이 제공되지 않았다면
    존재하지 않는 문제 조건을 추측하지 마세요.

    문제 조건을 알아야 판단 가능한 사항은
    오류라고 단정하지 말고 "문제 조건 확인 필요"라고 표시하세요.


  # =======================================================
  # 알고리즘 풀이와 관계없는 리뷰 기능
  # =======================================================

  # Public Repository의 저품질 PR 탐지는 스터디에 필요하지 않음
  slop_detection:
    enabled: false


  # =======================================================
  # 리뷰 대상 파일
  # =======================================================

  path_filters:
    # README 등 문서 제외
    - "!**/*.md"

    # GitHub 설정 제외
    - "!.github/**"

    # CodeRabbit 설정 자체 제외
    - "!.coderabbit.yaml"


  # =======================================================
  # Java 알고리즘 코드 전용 리뷰 규칙
  # =======================================================

  path_instructions:

    - path: "**/*.java"
      instructions: |
        이 저장소의 Java 파일은
        코딩테스트 및 알고리즘 학습을 위한 문제 풀이 코드입니다.

        작성자가 온라인 저지에서 문제를 해결한 뒤
        Pull Request를 작성하는 경우가 많으므로,
        단순히 버그를 찾는 것에만 집중하지 마세요.

        코드가 정상적으로 동작하더라도
        더 좋은 구현 방법이 있다면 적극적으로 리뷰하세요.


        ==================================================
        [1. 가장 중요한 리뷰 목표]
        ==================================================

        다음 항목을 우선적으로 검토하세요.

        1. 현재 풀이 방식이 코드 구조상 합리적인지
        2. 시간 복잡도를 줄일 수 있는지
        3. 공간 복잡도를 줄일 수 있는지
        4. 중복 탐색이나 중복 계산이 있는지
        5. 더 적절한 자료구조가 있는지
        6. 조건문이나 반복문을 더 단순하게 만들 수 있는지
        7. 상태 관리를 더 명확하게 만들 수 있는지
        8. 코드 중복을 줄일 수 있는지
        9. 가독성을 높일 수 있는지
        10. Java에서 더 안전하고 명확하게 작성할 수 있는지
        11. 현재 풀이와 비교할 가치가 있는 다른 알고리즘이 있는지

        단순히 "정답인가?"만 판단하지 마세요.


        ==================================================
        [2. 문제 조건을 임의로 추측하지 않기]
        ==================================================

        문제 원문, 입력 제한, 상세 조건이
        PR에 제공되지 않을 수 있습니다.

        따라서 코드에 없는 문제 조건을 임의로 만들어서
        현재 풀이가 정답 또는 오답이라고 단정하지 마세요.

        코드 자체에서 확인 가능한 내용을 중심으로 리뷰하세요.

        문제 조건을 알아야 판단 가능한 내용은
        반드시 "확인 필요"라고 표현하세요.

        예:

        나쁜 리뷰:

        "이 문제에서는 큰 값부터 처리해야 하므로 잘못되었습니다."

        좋은 리뷰:

        "현재 PriorityQueue는 작은 값부터 처리합니다.
        문제에서 큰 값을 우선하도록 요구한다면
        Comparator의 정렬 방향을 확인할 필요가 있습니다."


        ==================================================
        [3. 시간 복잡도]
        ==================================================

        현재 코드의 시간 복잡도를 적극적으로 분석하세요.

        특히 다음을 확인하세요.

        - 불필요한 중첩 반복문
        - 반복문 안에서 다시 전체 배열을 탐색하는 구조
        - 반복적인 List.contains()
        - 동일한 상태의 반복 탐색
        - DFS에서 동일 상태의 중복 계산
        - 반복적으로 수행되는 정렬
        - 동일 계산을 여러 번 수행하는 코드
        - 불필요하게 모든 경우를 확인하는 구조

        개선할 수 있다면
        현재 방식과 개선 방식의 복잡도를 비교하세요.

        예:

        "현재 방식은 List.contains()를 반복적으로 호출하기 때문에
        전체적으로 O(N²)이 됩니다.

        포함 여부 확인이 주 목적이라면 HashSet을 사용해
        평균 O(1) 조회로 개선하는 방법을 고려할 수 있습니다."

        문제의 입력 제한이 제공되지 않았다면
        시간 초과라고 단정하지 마세요.


        ==================================================
        [4. 공간 복잡도]
        ==================================================

        다음을 확인하세요.

        - 필요 이상의 배열 사용
        - 불필요한 2차원 또는 다차원 배열
        - 동일 정보를 여러 자료구조에 중복 저장
        - DFS마다 생성되는 불필요한 객체
        - Queue 또는 PriorityQueue의 불필요한 상태 저장
        - 방문 배열을 더 단순하게 관리할 수 있는지

        단순히 몇 바이트를 줄이는 수준의
        의미 없는 미세 최적화는 리뷰하지 마세요.


        ==================================================
        [5. 자료구조 선택]
        ==================================================

        현재 자료구조가 코드의 목적에 적절한지 확인하세요.

        예:

        - List 대신 Set이 적절한 경우
        - Stack 대신 Deque가 더 명확한 경우
        - 단순 Queue가 필요한데 PriorityQueue를 사용한 경우
        - 빈도 계산에 Map보다 배열이 간단한 경우
        - 객체 전체 대신 필요한 값만 저장해도 되는 경우

        다른 자료구조를 제안한다면
        반드시 현재 방식보다 어떤 점이 좋아지는지 설명하세요.


        ==================================================
        [6. 조건문 단순화]
        ==================================================

        알고리즘 문제에서 조건문이 지나치게 복잡해지는 부분을
        적극적으로 확인하세요.

        특히 다음을 검토하세요.

        - 지나치게 깊은 if 중첩
        - 같은 조건을 여러 번 검사
        - boolean 상태가 너무 많음
        - 하나의 조건문이 여러 역할을 수행
        - 불필요하게 많은 else if
        - 조건 순서를 바꾸면 단순해지는 경우

        가능한 경우 다음과 같은 방향을 고려하세요.

        - 실패 조건을 먼저 처리
        - early return
        - continue
        - 공통 조건 추출
        - boolean 의미 명확화
        - 공통 로직 메서드 분리

        단순히 코드 줄 수를 줄이는 것이 아니라
        읽고 이해하기 쉬워지는 경우에만 제안하세요.


        ==================================================
        [7. 반복 코드 / 메서드 분리]
        ==================================================

        유사한 코드가 반복된다면
        하나의 공통 로직으로 만들 수 있는지 확인하세요.

        특히 행/열 검사처럼
        동일한 알고리즘을 조금 다른 데이터에 반복 적용하는 구조는
        공통 메서드로 만들었을 때 더 명확해지는지 검토하세요.

        반대로 한두 줄짜리 코드까지
        무조건 메서드로 분리하라고 요구하지 마세요.

        메서드 분리가 다음 중 하나를 만족할 때만 제안하세요.

        - 중복 코드 감소
        - 복잡한 조건 분리
        - 역할 명확화
        - 디버깅 용이성 향상


        ==================================================
        [8. DFS / 백트래킹]
        ==================================================

        다음을 확인하세요.

        - 재귀 함수의 역할이 명확한지
        - 종료 조건
        - 방문 처리 시점
        - 상태 변경 → 재귀 → 상태 복구 흐름
        - visited 복구 여부
        - 배열 값 복구 여부
        - 선택 / 미선택 탐색 구조
        - 동일 상태 중복 탐색
        - 가지치기를 추가할 수 있는 부분
        - 불필요한 재귀 호출

        상태 복구가 잘 구현되어 있다면
        잘한 부분으로 명확하게 언급할 수 있습니다.

        더 좋은 가지치기가 있다면
        어떤 탐색을 줄일 수 있는지도 설명하세요.


        ==================================================
        [9. BFS]
        ==================================================

        다음을 확인하세요.

        - Queue 삽입 시점
        - 방문 처리 시점
        - 동일 상태 중복 삽입
        - 거리 / 시간 / 단계 관리
        - 상태 객체가 필요 이상으로 많은 값을 가지는지
        - 위치 외에 추가 상태가 필요한 구조인지
        - 불필요하게 전체 배열을 다시 탐색하는 부분

        BFS 자체가 적절하다면
        단순히 DFS도 가능하다는 이유로 다른 풀이를 제안하지 마세요.


        ==================================================
        [10. 구현 / 시뮬레이션]
        ==================================================

        다음을 확인하세요.

        - 연산 순서를 더 명확하게 표현할 수 있는지
        - 상태 갱신 로직이 지나치게 복잡하지 않은지
        - 동시에 처리해야 하는 값을 분리해서 관리할 필요가 있는지
        - row / column 또는 x / y 의미가 혼동되는지
        - dx / dy 사용이 이해하기 어려운지
        - 테스트 케이스 초기화 로직
        - 상태를 객체로 묶는 것이 더 명확한지
        - 반대로 객체를 지나치게 많이 생성하고 있지는 않은지


        ==================================================
        [11. DP]
        ==================================================

        다음을 확인하세요.

        - DP 상태 정의가 코드에서 명확한지
        - 초기값
        - 점화식 구현
        - 반복 순서
        - 불필요하게 큰 DP 배열
        - 이전 행만 필요하지만 전체 배열을 보관하는 경우
        - 동일 상태 중복 계산

        공간 최적화가 가능하더라도
        코드 복잡도가 크게 증가한다면
        장단점을 함께 설명하세요.


        ==================================================
        [12. 정렬 / Comparator]
        ==================================================

        다음을 확인하세요.

        - 정렬 방향
        - 비교 함수의 명확성
        - 동점 처리
        - 뺄셈 기반 Comparator의 overflow 가능성

        필요한 경우

        Integer.compare()
        Long.compare()

        등을 사용하는 방법을 제안하세요.


        ==================================================
        [13. Java 구현]
        ==================================================

        다음과 같은 Java 특유의 문제와 개선 가능성을 확인하세요.

        - int overflow
        - long 변환 전에 int 연산이 수행되는 문제
        - == 와 equals의 잘못된 사용
        - 불필요한 객체 생성
        - 반복적인 String + 연산
        - Queue / Deque / PriorityQueue 선택
        - Comparator 구현
        - static 상태 초기화
        - 불필요한 Boxing / Unboxing
        - 지나치게 넓은 변수 scope

        단, 알고리즘 풀이 코드에
        일반 서비스 수준의 객체지향 구조를 요구하지 마세요.


        ==================================================
        [14. 가독성]
        ==================================================

        다음처럼 실제 이해를 어렵게 만드는 부분은
        적극적으로 개선을 제안하세요.

        - 변수 하나가 여러 의미를 가짐
        - boolean 변수의 의미를 파악하기 어려움
        - 지나치게 긴 조건식
        - 조건문 중첩이 깊음
        - 같은 코드가 여러 번 반복됨
        - 하나의 메서드에서 서로 다른 역할이 섞임
        - 상태 변경 시점을 추적하기 어려움

        반대로 다음과 같은 단순 취향은 리뷰하지 마세요.

        - for문과 while문 선택
        - 중괄호 스타일
        - 사소한 변수명 취향
        - 모든 코드를 객체지향적으로 바꾸기
        - 의미 없는 클래스 분리
        - 디자인 패턴 적용


        ==================================================
        [15. 더 좋은 다른 풀이]
        ==================================================

        현재 코드와 비교할 가치가 있는 다른 풀이가 있다면
        적극적으로 소개할 수 있습니다.

        단, 다음 중 하나 이상의 의미가 있어야 합니다.

        - 시간 복잡도가 더 좋음
        - 공간 복잡도가 더 좋음
        - 구현이 상당히 단순해짐
        - 코드 가독성이 크게 좋아짐
        - 해당 문제 유형에서 알아둘 가치가 있는 대표 풀이

        다음과 같이 비교해서 설명하세요.

        "현재 방식은 DFS로 모든 경우를 탐색합니다.

        동일 상태가 여러 경로에서 반복된다면
        상태를 정의해 DP 또는 메모이제이션으로 처리하는 방법도
        비교해볼 수 있습니다."

        현재 풀이가 충분히 좋은 경우에는
        굳이 다른 풀이를 만들어내지 마세요.


        ==================================================
        [16. Inline Review 기준]
        ==================================================

        Inline comment는 버그에만 사용하지 마세요.

        코드의 특정 부분을 변경했을 때
        실질적인 개선 효과가 있다면 적극적으로 리뷰하세요.

        예:

        🟢 가독성 개선
        - 복잡한 조건문 단순화
        - 중복 코드 제거
        - 상태 의미 명확화

        🟢 성능 개선
        - 중복 탐색 제거
        - 자료구조 변경
        - 불필요한 반복 제거

        💡 다른 접근
        - 현재 구현보다 명확하게 장점이 있는 다른 방식

        🔴 오류
        - 코드 자체에서 확인 가능한 논리 오류
        - 런타임 오류 가능성

        🟠 확인 필요
        - 문제 조건이 있어야 정확하게 판단 가능한 사항

        단순 취향 수준의 코멘트를
        억지로 만들지는 마세요.


        ==================================================
        [17. 리뷰 설명 방식]
        ==================================================

        개선점을 발견했다면 단순히

        "이렇게 바꾸세요."

        로 끝내지 마세요.

        가능한 경우 다음 순서로 설명하세요.

        1. 현재 코드가 어떻게 동작하는지
        2. 어떤 부분을 개선할 수 있는지
        3. 왜 개선하는 것이 좋은지
        4. 시간/공간 복잡도가 어떻게 달라지는지
        5. 구현 방향 또는 작은 예시

        전체 정답 코드를 대신 작성하기보다
        작성자가 직접 수정할 수 있도록
        핵심 아이디어와 방향을 설명하세요.


  # =======================================================
  # 자동 리뷰
  # =======================================================

  auto_review:

    # PR 생성 시 자동 리뷰
    enabled: true

    # 풀이 중인 Draft PR은 제외
    drafts: false

    # 새로운 commit이 push되면 변경 사항 재리뷰
    auto_incremental_review: true

    # 작은 수정이 계속 올라올 때 과도한 반복 리뷰 방지
    auto_pause_after_reviewed_commits: 5

    ignore_title_keywords:
      - "WIP"
      - "[skip review]"

    # 필요하면 이 Label을 붙여 AI 리뷰 제외
    labels:
      - "!skip-ai-review"


  # =======================================================
  # CodeRabbit 자동 코드 수정 기능 비활성화
  # =======================================================

  finishing_touches:

    # 알고리즘 풀이에 자동 문서 생성 불필요
    docstrings:
      enabled: false

    # AI가 테스트 코드를 대신 생성하지 않음
    unit_tests:
      enabled: false

    # AI가 자동으로 코드를 단순화해 commit하지 않음
    simplify:
      enabled: false

    # AI가 리뷰 내용을 직접 수정하지 않음
    autofix:
      enabled: false

    # CI 자동 수정하지 않음
    fix_ci:
      enabled: false

    # Merge conflict를 AI가 직접 해결하지 않음
    resolve_merge_conflict:
      enabled: false


  # =======================================================
  # 정적 분석 도구
  # =======================================================

  tools:

    # 한글 폴더/파일 경로에서 InvalidPathException이 발생했으므로
    # PMD는 사용하지 않고 CodeRabbit AI 리뷰만 사용
    pmd:
      enabled: false


# =========================================================
# CodeRabbit Chat
# =========================================================

chat:

  # ASCII / Emoji Art 비활성화
  art: false

  # Organization 외부 사용자의 CodeRabbit 호출 제한
  allow_non_org_members: false

  # 일반 댓글에 자동으로 끼어들지 않고
  # @coderabbitai 멘션이 있을 때만 대화
  auto_reply: false


# =========================================================
# Knowledge Base
# =========================================================

knowledge_base:

  # 문제 이름을 보고 인터넷의 풀이/정답을 검색해
  # 비교하는 방식은 사용하지 않음
  web_search:
    enabled: true

  # 이 저장소에서 학습한 리뷰 선호도는 이 저장소에서만 사용
  learnings:
    scope: "local"
